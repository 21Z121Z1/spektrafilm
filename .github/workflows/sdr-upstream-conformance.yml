name: SDR Upstream Conformance

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_apple_backends:
        description: Run GitHub-hosted macOS 26 Apple Silicon full validation
        required: false
        default: false
        type: boolean

env:
  UV_FROZEN: '1'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core_changed: ${{ steps.diff.outputs.core_changed }}
      native_changed: ${{ steps.diff.outputs.native_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed.txt
          else
            git ls-files > changed.txt
          fi
          if grep -E '^(src/spektrafilm/(model|runtime|gpu|profiles|data)/|src/spektrafilm/utils/(spectral_|fast_gaussian_filter.py)|src/spektrafilm_gui/|tools/sdr_alignment/|tests/alignment/|pyproject.toml|uv.lock|\.github/workflows/sdr-upstream-conformance.yml)' changed.txt >/dev/null; then
            echo "core_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "core_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -E '^(src/spektrafilm/gpu/native_metal/|src/spektrafilm/utils/fast_gaussian_filter.py|tests/native_metal/|pyproject.toml|uv.lock|\.github/workflows/sdr-upstream-conformance.yml)' changed.txt >/dev/null; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "native_changed=false" >> "$GITHUB_OUTPUT"
          fi

  quick:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.8.22
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run alignment contract schema
        run: uv run python -m pytest -q tests/alignment/test_alignment_contract_schema.py
      - name: Run spectral upsampling CPU tests
        run: uv run python -m pytest -q tests/test_spectral_lut_registry.py tests/test_spectral_reflectance.py tests/test_spectral_runtime.py
      - name: Run film base CPU and GUI tests
        run: uv run python -m pytest -q tests/test_film_base.py tests/test_film_base_gui_state.py
      - name: Run quick CPU upstream conformance
        run: uv run python -m tools.sdr_alignment.run_alignment --mode upstream_compat --suite quick --backend cpu --output-dir artifacts/sdr_alignment/quick-cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdr-alignment-quick
          path: artifacts/sdr_alignment/
          if-no-files-found: ignore

  full:
    needs: changes
    if: needs.changes.outputs.core_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.8.22
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run full CPU upstream conformance
        run: uv run python -m tools.sdr_alignment.run_alignment --mode upstream_compat --suite full --backend cpu --output-dir artifacts/sdr_alignment/full-cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdr-alignment-full-cpu
          path: artifacts/sdr_alignment/full-cpu/
          if-no-files-found: error

  apple-backends:
    if: (github.event_name == 'workflow_dispatch' && inputs.run_apple_backends) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-apple-backend'))
    runs-on: macos-26
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Probe macOS 26 Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          sw_vers
          system_profiler SPHardwareDataType SPDisplaysDataType || true
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.8.22
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra gpu-apple
      - name: Smoke-test MLX Metal backend
        run: |
          uv run python - <<'PY'
          import mlx.core as mx
          print("MLX default device:", mx.default_device())
          x = mx.arange(4096, dtype=mx.float32)
          y = mx.sum(x * x)
          mx.eval(y)
          print("MLX Metal smoke result:", y.item())
          assert "gpu" in str(mx.default_device()).lower()
          PY
      - name: Run complete pytest suite on macOS 26
        run: uv run python -m pytest -q
      - name: Run full CPU upstream conformance on macOS 26
        run: uv run python -m tools.sdr_alignment.run_alignment --mode upstream_compat --suite full --backend cpu --output-dir artifacts/sdr_alignment/apple-cpu-full
      - name: Run full MLX/Metal upstream conformance on macOS 26
        id: mlx_full
        continue-on-error: true
        run: uv run python -m tools.sdr_alignment.run_alignment --mode upstream_compat --suite full --backend mlx --output-dir artifacts/sdr_alignment/apple-mlx-full
      - name: Enforce MLX full no-regression against develop baseline
        shell: bash
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("artifacts/sdr_alignment/apple-mlx-full/report.json")
          if not path.exists():
              raise SystemExit("MLX full run did not produce report.json")
          report = json.loads(path.read_text())
          if report.get("status") == "ok":
              print("MLX full absolute conformance passed.")
              raise SystemExit(0)

          # macOS 26 / MLX 0.31.2 baseline established from unmodified
          # develop in temporary PR #10, run 31372695548. PR #8 matched
          # this normalized report exactly. Any new metric change remains red.
          report.pop("output_dir", None)
          normalized = json.dumps(report, sort_keys=True, separators=(",", ":")).encode()
          digest = hashlib.sha256(normalized).hexdigest()
          expected = "0275ca9677333d764e05280c67be214a71f877a73a5e506146e5efe40c08de9d"
          print("normalized MLX full report sha256:", digest)
          if digest != expected:
              raise SystemExit(
                  "MLX full differs from the established develop baseline; "
                  "treat as a regression until reviewed"
              )
          print("MLX full matches the established develop baseline exactly.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdr-alignment-macos26-full
          path: |
            artifacts/sdr_alignment/apple-cpu-full/
            artifacts/sdr_alignment/apple-mlx-full/
          if-no-files-found: error

  native-spatial:
    needs: changes
    if: needs.changes.outputs.native_changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      NUMBA_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      UV_FROZEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv and frozen dependencies
        run: |
          python -m pip install uv==0.8.22
          uv sync --frozen --extra dev
      - name: Prepare Apple toolchain
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          uname -a
          xcodebuild -version
          system_profiler SPHardwareDataType SPDisplaysDataType
          test "$(uname -m)" = "arm64"
          if ! xcrun --sdk macosx --find metal; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Native arithmetic and actual-device tests
        run: uv run --frozen python -m pytest tests/native_metal -q --junitxml=artifacts/native-spatial/tests.xml
      - name: Synchronized Gaussian microbenchmark (not full pipeline)
        if: runner.os == 'macOS'
        run: |
          uv run --frozen python -m spektrafilm.gpu.native_metal.build --output artifacts/native-spatial/build
          uv run --frozen python tests/native_metal/benchmark.py --bundle artifacts/native-spatial/build --output artifacts/native-spatial/gaussian.json
      - name: Complete non-GUI regression suite on its required Apple platform
        if: runner.os == 'macOS'
        run: |
          uv sync --frozen --extra dev --extra gpu-apple
          uv run --frozen --extra dev --extra gpu-apple python -m pytest --ignore=tests/gui -q --junitxml=artifacts/native-spatial/regression.xml
      - name: Verify wheel carries native sources and the lock stayed unchanged
        if: runner.os == 'Linux'
        run: |
          uv build --wheel --out-dir artifacts/native-spatial/wheel
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import zipfile
          from spektrafilm.gpu.native_metal import SOURCE_FILES
          wheels = list(Path("artifacts/native-spatial/wheel").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              for name in SOURCE_FILES:
                  key = "spektrafilm/gpu/native_metal/" + name
                  assert wheel.read(key) == (Path("src") / key).read_bytes(), key
          PY
          git diff --exit-code -- uv.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-spatial-${{ matrix.os }}
          path: artifacts/native-spatial/
          if-no-files-found: error
